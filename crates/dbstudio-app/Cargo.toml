[package]
name = "dbstudio-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dbstudio-core = { workspace = true }
dbstudio-drivers = { workspace = true }
dbstudio-secrets = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
iced = { workspace = true, features = ["tokio", "svg"] }
iced-code-editor = { workspace = true }
iced-autocomplete = { workspace = true }
oriel-core = { workspace = true }
oriel-iced = { workspace = true }
rfd = { version = "0.15", default-features = false }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "dbstudio"
path = "src/main.rs"
